services:
  gotify:
    image: gotify/server
    labels:
      - wud.watch.digest=true
    ports:
      - 8087:80
    environment:
      GOTIFY_DEFAULTUSER_PASS: 'admin'
    volumes:
      - ./data:/app/data
    # to run gotify as a dedicated user:
    # sudo chown -R 1234:1234 ./gotify_data
    # user: "1234:1234"
    restart: always