---
- name: Update Proxmox nodes
  hosts: proxmox
  become: true
  gather_facts: false
  serial: 1
  tasks:
    # Semaphore runs inside LXC 112 on pve01, so rebooting pve01 in-line would
    # kill this job partway through. That host has to come last, and its
    # reboot is scheduled to happen after the job ends (end of this play).
    - name: Make sure the host running Semaphore is updated last
      ansible.builtin.assert:
        that: (groups['semaphore_host'] | default([]) | length == 0) or (ansible_play_hosts_all[-1] in groups['semaphore_host'])
        fail_msg: "{{ groups['semaphore_host'] | default([]) | join(', ') }} runs Semaphore and must be the last host in the [proxmox] inventory group"
      run_once: true

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 60

    - name: Gather upgradable packages
      ansible.builtin.shell: apt list --upgradable | sed '/Listing.../d'
      register: apt_list_upgradable_result
      changed_when: false

    - name: Display upgradable packages
      ansible.builtin.debug:
        var: apt_list_upgradable_result.stdout_lines

    - name: Install apt upgrades
      ansible.builtin.apt:
        upgrade: full
        autoremove: true
        autoclean: true
        lock_timeout: 60

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    # Proxmox kernel packages never create /var/run/reboot-required, so on its
    # own that check never rebooted a host for a kernel update (hosts drifted
    # several kernels behind). Compare the running kernel with the one the next
    # boot will use: the pinned kernel if there is one, else the newest in
    # /boot. Containers run their host's kernel, so they are skipped.
    - name: Check whether a newer kernel is waiting for a reboot
      ansible.builtin.shell: |
        set -eu
        if systemd-detect-virt --container --quiet; then
          echo "KERNEL_OK container"; exit 0
        fi
        running=$(uname -r)
        target=$(proxmox-boot-tool kernel list 2>/dev/null | awk '/^Pinned kernel:/ {getline; print $1; exit}')
        via=pin
        if [ -z "$target" ]; then
          target=$(ls /boot/vmlinuz-* 2>/dev/null | sed 's|^/boot/vmlinuz-||' | sort -V | tail -n 1)
          via=newest
        fi
        if [ -n "$target" ] && [ "$running" != "$target" ]; then
          echo "KERNEL_REBOOT running=$running target=$target via=$via"
        else
          echo "KERNEL_OK running=$running target=${target:-none} via=$via"
        fi
      register: kernel_check
      changed_when: false

    - name: Decide whether this host needs a reboot
      ansible.builtin.set_fact:
        needs_reboot: "{{ reboot_required_file.stat.exists or kernel_check.stdout is search('^KERNEL_REBOOT') }}"
        kernel_target: "{{ kernel_check.stdout | regex_replace('^.*target=(\\S*).*$', '\\1') }}"
        is_semaphore_host: "{{ inventory_hostname in (groups['semaphore_host'] | default([])) }}"

    - name: Show if reboot is required
      ansible.builtin.debug:
        msg: "Reboot is required! Node will be restarted. ({{ kernel_check.stdout }}; reboot-required file: {{ reboot_required_file.stat.exists }})"
      when: needs_reboot | bool

    - name: Verify cluster quorum before reboot
      ansible.builtin.command: pvecm status
      register: quorum_check_before
      changed_when: false
      when: needs_reboot | bool and inventory_hostname in groups['pve_cluster']

    - name: Abort if cluster is not quorate
      ansible.builtin.assert:
        that: quorum_check_before.stdout is search('Quorate:\\s*Yes')
        fail_msg: "Cluster is not quorate, refusing to reboot {{ inventory_hostname }}"
      when: needs_reboot | bool and inventory_hostname in groups['pve_cluster']

    - name: Enable HA maintenance mode
      ansible.builtin.command: "ha-manager crm-command node-maintenance enable {{ inventory_hostname }}"
      when: needs_reboot | bool and inventory_hostname in groups['pve_cluster'] and not is_semaphore_host | bool

    - name: Reboot if required
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible after upgrades."
        reboot_timeout: 900
      when: needs_reboot | bool and not is_semaphore_host | bool

    - name: Wait for node to become reachable after reboot
      ansible.builtin.wait_for_connection:
        timeout: 600
      when: needs_reboot | bool and not is_semaphore_host | bool

    # ha-manager needs cluster quorum, so leaving maintenance mode has to wait
    # until the node is back in the cluster. SSH comes up before corosync does:
    # on 2026-09-15 the disable ran right after the reboot, failed with
    # "cfs-lock 'domain-ha' error: no quorum!" and left pve02 in maintenance
    # mode for four days. If the node doesn't rejoin, the job fails here (so
    # no other node is rebooted) and says the node is still in maintenance.
    - name: Rejoin the cluster and leave HA maintenance mode
      when: needs_reboot | bool and inventory_hostname in groups['pve_cluster'] and not is_semaphore_host | bool
      block:
        - name: Verify cluster quorum after reboot
          ansible.builtin.command: pvecm status
          register: quorum_check_after
          until: quorum_check_after.stdout is search('Quorate:\\s*Yes')
          retries: 30
          delay: 10
          changed_when: false

        - name: Disable HA maintenance mode
          ansible.builtin.command: "ha-manager crm-command node-maintenance disable {{ inventory_hostname }}"
          register: ha_maintenance_disable
          until: ha_maintenance_disable.rc == 0
          retries: 6
          delay: 10
      rescue:
        - name: Report that the node is still in HA maintenance mode
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }} failed at "{{ ansible_failed_task.name }}" and is still
              in HA maintenance mode. Once `pvecm status` on it shows Quorate: Yes, run
              `ha-manager crm-command node-maintenance disable {{ inventory_hostname }}`.

    # Gate on Ceph's actual state, not the health status. Accepting HEALTH_WARN
    # let the next node reboot while PGs were still degraded from this one.
    # And since Ceph 20.2.4 the status can read HEALTH_ERR for reasons that do
    # not affect data (the AUTH_INSECURE_* key-type checks), which blocked the
    # job entirely. See homelab-ops
    # runbooks/2026-09-10-rolling-upgrade-kernel-ceph-gpu-card-renumber.md
    - name: Wait for Ceph to recover (all PGs active+clean, all OSDs up and in, all mons in quorum)
      ansible.builtin.command: ceph status -f json
      register: ceph_status_result
      until:
        - ceph_status_result.rc == 0
        - (ceph_status_result.stdout | from_json).pgmap.pgs_by_state
          | selectattr('state_name', 'equalto', 'active+clean')
          | map(attribute='count') | sum
          == (ceph_status_result.stdout | from_json).pgmap.num_pgs
        - (ceph_status_result.stdout | from_json).osdmap.num_up_osds
          == (ceph_status_result.stdout | from_json).osdmap.num_osds
        - (ceph_status_result.stdout | from_json).osdmap.num_in_osds
          == (ceph_status_result.stdout | from_json).osdmap.num_osds
        - (ceph_status_result.stdout | from_json).quorum_names | length
          == (ceph_status_result.stdout | from_json).monmap.num_mons
      retries: 60
      delay: 10
      changed_when: false
      when: needs_reboot | bool and inventory_hostname in groups['pve_cluster'] and not is_semaphore_host | bool

    # A kernel reboot that doesn't land on the expected kernel (e.g. GRUB not
    # defaulting to the newest entry) would otherwise reboot this host again on
    # every run. Fail loudly instead, which also stops the rolling update here.
    - name: Verify the expected kernel is running after the reboot
      ansible.builtin.command: uname -r
      register: kernel_after
      changed_when: false
      failed_when: kernel_after.stdout != kernel_target
      when: needs_reboot | bool and kernel_check.stdout is search('^KERNEL_REBOOT') and not is_semaphore_host | bool

    # The Semaphore host can't be rebooted in-line (the job runs on it), so it
    # is last and its reboot is scheduled for after the job ends. No HA
    # maintenance mode (nothing would switch it off again) and no checks after
    # the reboot; the next run's kernel check confirms it. Guard against a
    # nightly reboot loop first: these hosts boot through GRUB with
    # GRUB_DEFAULT=0, so the first menu entry must be the target kernel.
    # (A pinned kernel is an explicit admin choice and is not checked here.)
    - name: Check the Semaphore host's next boot uses the expected kernel
      ansible.builtin.shell: grep -m1 -oE 'vmlinuz-[^ ]+' /boot/grub/grub.cfg | sed 's/^vmlinuz-//'
      register: grub_next
      changed_when: false
      failed_when: grub_next.stdout != kernel_target
      when: needs_reboot | bool and is_semaphore_host | bool and kernel_check.stdout is search('^KERNEL_REBOOT .* via=newest')

    - name: Schedule the Semaphore host's reboot for after this job ends
      ansible.builtin.command: shutdown -r +3 "Reboot scheduled by Semaphore after upgrades"
      when: needs_reboot | bool and is_semaphore_host | bool
