# -----------------------------------------------------------
# Seerr Docker Compose Configuration
# Description: Media request management for Jellyfin
# -----------------------------------------------------------

  seerr:
    container_name: seerr
    labels:
      - wud.watch.digest=true
    image: ghcr.io/hotio/seerr
    ports:
      - "5055:5055"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    volumes:
      - /media/servarr/seerr/config:/config
    restart: always

# -----------------------------------------------------------
# Jellyfin Docker Compose Configuration
# Description: Media server for streaming movies and TV shows
# -----------------------------------------------------------
  jellyfin:
    image: ghcr.io/hotio/jellyfin
    container_name: jellyfin
    labels:
      - wud.watch.digest=true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
      # Cache management settings
      - JELLYFIN_CACHE_DIR=/config/cache
      - JELLYFIN_TRANSCODING_TEMP_PATH=/config/cache/transcodes
    volumes:
      - /media/servarr/jellyfin/config:/config
      - /mnt/qnap/servarr:/data
    ports:
      - 8096:8096
      - 8920:8920     #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional
    restart: always

# -----------------------------------------------------------
# Plex Docker Compose Configuration
# Description: Media server for streaming movies and TV shows
# -----------------------------------------------------------
  plex:
    container_name: plex
    labels:
      - wud.watch.digest=true
    image: ghcr.io/hotio/plex
    ports:
      - "32400:32400"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "993"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
      - PLEX_CLAIM_TOKEN=${PLEX_CLAIM_TOKEN}
      - PLEX_ADVERTISE_URL=${PLEX_ADVERTISE_URL}
      - PLEX_NO_AUTH_NETWORKS=${PLEX_NO_AUTH_NETWORKS}
      - PLEX_BETA_INSTALL=${PLEX_BETA_INSTALL}
      - PLEX_PURGE_CODECS=${PLEX_PURGE_CODECS}
    volumes:
      - /media/servarr/plex/:/config
      - /mnt/qnap/servarr:/data
      - /root/docker_services/servarr/init-hook-app:/etc/s6-overlay/init-hook-app:ro
    # Transcodes go to RAM instead of the Ceph rootfs. Plex's "Transcoder
    # temporary directory" setting must point at /transcode. 4g covers a few
    # simultaneous 1080p transcodes; raise it if 4K transcoding becomes common.
    tmpfs:
      - /transcode:size=4g
    restart: always

# -----------------------------------------------------------
# Tautulli Docker Compose Configuration
# Description: Monitoring and tracking for Plex Media Server
# -----------------------------------------------------------
  tautulli:
    container_name: tautulli
    labels:
      - wud.watch.digest=true
    image: ghcr.io/hotio/tautulli
    ports:
      - "8581:8181"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
      - WEBUI_PORTS=8181/tcp,8181/udp
    volumes:
      - /media/servarr/tautulli/config:/config
    restart: always